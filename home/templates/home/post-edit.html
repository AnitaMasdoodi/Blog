{% extends "_base.html" %}
<body>
    {% block content %}
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Edit Post</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <input type = 'submit' value='Update'>
                </form>
            </div>
        </div>
    </div>
    {% endblock content %}
</body>
