<body>
    {% block content %}
    
    <div class="container py-5">
        <h1 class="text-center text-danger">Delete Profile</h1>
        <p class="text-center">This action cannot be undone. Are you sure you want to delete your profile?</p>
        
        <div class="text-center">
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a href="{% url 'profile' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>

    {% endblock content %}
</body>
