{% extends "_base.html" %}
<body>
    {% block content %}
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Edit Profile</h3>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
    {% endblock content %}
</body>
